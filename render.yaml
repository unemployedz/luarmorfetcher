# Render Blueprint -- Discord bot hosted as a free web service.
#
# The HTTP endpoint keeps the web service healthy; the Discord bot runs in the
# same process. Free web services may spin down after inactivity.
services:
  - type: web
    name: luarmorfetcher-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.1"
      - key: LRM_PREFIX
        value: "."
      - key: LRM_PENDING_TTL
        value: "180"
